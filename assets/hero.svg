<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="250" fill="none">
  <defs>
    <!-- Background Gradient: Obsidian to Carbon -->
    <linearGradient id="bgObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="50%" stop-color="#0E0E12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Warm Amber Accent Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Technical Dot Grid -->
    <pattern id="dotGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#27272A" />
    </pattern>

    <!-- Radial Glow from top-left -->
    <radialGradient id="amberGlow" cx="20%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .hero-title { font-weight: 800; letter-spacing: -0.04em; fill: #FAFAFA; font-size: 36px; }
    .badge-mono { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
  </style>

  <!-- Container -->
  <rect width="960" height="250" rx="14" fill="url(#bgObsidian)"/>
  <rect width="960" height="250" rx="14" fill="url(#dotGrid)"/>
  <rect width="960" height="250" rx="14" fill="url(#amberGlow)"/>
  <rect width="958" height="248" x="1" y="1" rx="13" fill="none" stroke="#27272A" stroke-width="1"/>

  <!-- Top Amber Hairline Accent -->
  <rect x="2" y="1" width="420" height="2" fill="url(#amberGrad)" rx="1"/>

  <!-- Top System Bar -->
  <g transform="translate(36, 26)">
    <!-- Status Tag -->
    <rect width="130" height="24" rx="12" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <circle cx="14" cy="12" r="3.5" fill="#F59E0B">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="15.5" class="mono badge-mono" fill="#F4F4F5">R&amp;D // HARDWARE+AI</text>
    
    <text x="146" y="16" class="mono" fill="#52525B" font-size="10" letter-spacing="0.08em">NODE: JOEL710 · ARCH-V3.8</text>
  </g>

  <!-- Hero Typography -->
  <g transform="translate(36, 84)">
    <text x="0" y="0" class="mono badge-mono" fill="#F59E0B">APPLIED INTELLIGENCE • EMBEDDED TELEMETRY • PRODUCT SYSTEMS</text>
    <text x="0" y="40" class="sans hero-title">Joël Elisée Adzonya</text>
    <text x="0" y="70" class="sans" fill="#A1A1AA" font-size="14.5" font-weight="400">
      Ingénierie de précision : du silicium IoT à la synthèse vocale pour langues africaines.
    </text>
  </g>

  <!-- Bottom Spec Modules -->
  <g transform="translate(36, 194)">
    <!-- Block 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="mono" fill="#52525B" font-size="9" font-weight="600" letter-spacing="0.1em">SPECIALISATION</text>
      <text x="0" y="16" class="mono" fill="#E4E4E7" font-size="11.5" font-weight="500">Éwé TTS · Acoustique · IoT Terrain</text>
    </g>

    <line x1="240" y1="-8" x2="240" y2="20" stroke="#27272A" stroke-width="1"/>

    <!-- Block 2 -->
    <g transform="translate(260, 0)">
      <text x="0" y="0" class="mono" fill="#52525B" font-size="9" font-weight="600" letter-spacing="0.1em">CORE ENGINE</text>
      <text x="0" y="16" class="mono" fill="#E4E4E7" font-size="11.5" font-weight="500">PyTorch · ESP32 · Flutter · Python</text>
    </g>

    <line x1="500" y1="-8" x2="500" y2="20" stroke="#27272A" stroke-width="1"/>

    <!-- Block 3 -->
    <g transform="translate(520, 0)">
      <text x="0" y="0" class="mono" fill="#52525B" font-size="9" font-weight="600" letter-spacing="0.1em">ORIGIN / TIMEZONE</text>
      <text x="0" y="16" class="mono" fill="#E4E4E7" font-size="11.5" font-weight="500">Lomé, Togo (UTC+0) · Global Delivery</text>
    </g>
  </g>

  <!-- Right Visual Component: Precision Telemetry Cockpit -->
  <g transform="translate(734, 24)">
    <rect width="190" height="202" rx="10" fill="#0C0C0F" stroke="#27272A" stroke-width="1"/>
    
    <!-- Mini Terminal Header -->
    <rect width="190" height="26" rx="9" fill="#141418"/>
    <line x1="0" y1="26" x2="190" y2="26" stroke="#27272A" stroke-width="1"/>
    <text x="14" y="17" class="mono" fill="#71717A" font-size="9" font-weight="600" letter-spacing="0.08em">SYSTEM MATRIX</text>
    <circle cx="174" cy="13" r="2.5" fill="#F59E0B"/>

    <!-- Dynamic Waveform Lines (Speech Synthesis representation) -->
    <g transform="translate(14, 42)">
      <text x="0" y="0" class="mono" fill="#71717A" font-size="8" letter-spacing="0.08em">YAWO ACOUSTIC HARMONICS</text>
      <path d="M 0 20 Q 20 2, 40 20 T 80 20 T 120 20 T 160 20" fill="none" stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M 0 20 Q 20 32, 40 20 T 80 20 T 120 20 T 160 20" fill="none" stroke="#D97706" stroke-width="0.8" opacity="0.5"/>
    </g>

    <!-- Telemetry Meter -->
    <g transform="translate(14, 88)">
      <text x="0" y="0" class="mono" fill="#71717A" font-size="8" letter-spacing="0.08em">AGRIFLOW SENSOR FEED</text>
      <!-- Gauge Bars -->
      <rect x="0" y="8" width="162" height="6" rx="3" fill="#1C1C22"/>
      <rect x="0" y="8" width="128" height="6" rx="3" fill="#F59E0B">
        <animate attributeName="width" values="128;138;122;128" dur="4s" repeatCount="indefinite" />
      </rect>

      <rect x="0" y="20" width="162" height="6" rx="3" fill="#1C1C22"/>
      <rect x="0" y="20" width="94" height="6" rx="3" fill="#71717A"/>
    </g>

    <!-- Micro specs -->
    <g transform="translate(14, 142)">
      <rect width="162" height="44" rx="6" fill="#141418" stroke="#1F1F24" stroke-width="1"/>
      <text x="10" y="16" class="mono" fill="#52525B" font-size="8">TONAL LOSS (ÉWÉ)</text>
      <text x="10" y="32" class="mono" fill="#FAFAFA" font-size="11" font-weight="700">0.0142 <tspan fill="#F59E0B" font-size="8">OPTIMAL</tspan></text>
      <text x="115" y="32" class="mono" fill="#10B981" font-size="9">● SYNC</text>
    </g>
  </g>
</svg>
