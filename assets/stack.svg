<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="210" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .col-title { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .tag-text { font-size: 11px; font-weight: 500; fill: #E2E8F0; }
    .tag-sub { font-size: 9px; font-weight: 400; fill: #64748B; }
  </style>

  <!-- Background Base -->
  <rect width="960" height="210" rx="10" fill="#070A10" stroke="#1E293B" stroke-width="1"/>

  <!-- Column 1: Applied AI & Language Engineering -->
  <g transform="translate(16, 16)">
    <rect width="298" height="178" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Header -->
    <path d="M 0 8 C 0 3.5 3.5 0 8 0 L 290 0 C 294.5 0 298 3.5 298 8 L 298 34 L 0 34 Z" fill="#131C31"/>
    <line x1="0" y1="34" x2="298" y2="34" stroke="#1E293B" stroke-width="1"/>
    <circle cx="16" cy="17" r="3.5" fill="#38BDF8"/>
    <text x="28" y="21" class="mono col-title" fill="#38BDF8">01 // APPLIED AI &amp; NLP</text>

    <!-- Items -->
    <g transform="translate(14, 48)">
      <!-- Item 1 -->
      <rect width="270" height="24" rx="4" fill="#0B1120" stroke="#1E293B" stroke-width="0.8"/>
      <text x="10" y="16" class="mono tag-text">PyTorch · Librosa · Speech DSP</text>
      
      <!-- Item 2 -->
      <g transform="translate(0, 30)">
        <rect width="270" height="24" rx="4" fill="#0B1120" stroke="#1E293B" stroke-width="0.8"/>
        <text x="10" y="16" class="mono tag-text">Éwé TTS &amp; Phonetic Modeling</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 60)">
        <rect width="270" height="24" rx="4" fill="#0B1120" stroke="#1E293B" stroke-width="0.8"/>
        <text x="10" y="16" class="mono tag-text">Semantic Search · Vector Embeddings</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 90)">
        <rect width="270" height="24" rx="4" fill="#0B1120" stroke="#1E293B" stroke-width="0.8"/>
        <text x="10" y="16" class="mono tag-text">Geospatial Recommender Systems</text>
      </g>
    </g>
  </g>

  <!-- Column 2: Embedded Systems & Hardware -->
  <g transform="translate(331, 16)">
    <rect width="298" height="178" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Header -->
    <path d="M 0 8 C 0 3.5 3.5 0 8 0 L 290 0 C 294.5 0 298 3.5 298 8 L 298 34 L 0 34 Z" fill="#131C31"/>
    <line x1="0" y1="34" x2="298" y2="34" stroke="#1E293B" stroke-width="1"/>
    <circle cx="16" cy="17" r="3.5" fill="#F59E0B"/>
    <text x="28" y="21" class="mono col-title" fill="#F59E0B">02 // HARDWARE &amp; TELEMETRY</text>

    <!-- Items -->
    <g transform="translate(14, 48)">
      <!-- Item 1 -->
      <rect width="270" height="24" rx="4" fill="#0B1120" stroke="#1E293B" stroke-width="0.8"/>
      <text x="10" y="16" class="mono tag-text">ESP32 · Arduino · Embedded C/C++</text>
      
      <!-- Item 2 -->
      <g transform="translate(0, 30)">
        <rect width="270" height="24" rx="4" fill="#0B1120" stroke="#1E293B" stroke-width="0.8"/>
        <text x="10" y="16" class="mono tag-text">Raspberry Pi · Edge Gateways</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 60)">
        <rect width="270" height="24" rx="4" fill="#0B1120" stroke="#1E293B" stroke-width="0.8"/>
        <text x="10" y="16" class="mono tag-text">Field Sensor Calibration &amp; IoT Data</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 90)">
        <rect width="270" height="24" rx="4" fill="#0B1120" stroke="#1E293B" stroke-width="0.8"/>
        <text x="10" y="16" class="mono tag-text">Agritech Automation &amp; Low-Power</text>
      </g>
    </g>
  </g>

  <!-- Column 3: Full-Stack & Engineering Infrastructure -->
  <g transform="translate(646, 16)">
    <rect width="298" height="178" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Header -->
    <path d="M 0 8 C 0 3.5 3.5 0 8 0 L 290 0 C 294.5 0 298 3.5 298 8 L 298 34 L 0 34 Z" fill="#131C31"/>
    <line x1="0" y1="34" x2="298" y2="34" stroke="#1E293B" stroke-width="1"/>
    <circle cx="16" cy="17" r="3.5" fill="#10B981"/>
    <text x="28" y="21" class="mono col-title" fill="#10B981">03 // SOFTWARE &amp; SYSTEMS</text>

    <!-- Items -->
    <g transform="translate(14, 48)">
      <!-- Item 1 -->
      <rect width="270" height="24" rx="4" fill="#0B1120" stroke="#1E293B" stroke-width="0.8"/>
      <text x="10" y="16" class="mono tag-text">Dart &amp; Flutter (iOS / Android)</text>
      
      <!-- Item 2 -->
      <g transform="translate(0, 30)">
        <rect width="270" height="24" rx="4" fill="#0B1120" stroke="#1E293B" stroke-width="0.8"/>
        <text x="10" y="16" class="mono tag-text">Python · TypeScript · Rust</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 60)">
        <rect width="270" height="24" rx="4" fill="#0B1120" stroke="#1E293B" stroke-width="0.8"/>
        <text x="10" y="16" class="mono tag-text">FastAPI · REST / WebSocket APIs</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 90)">
        <rect width="270" height="24" rx="4" fill="#0B1120" stroke="#1E293B" stroke-width="0.8"/>
        <text x="10" y="16" class="mono tag-text">Docker · Linux Systems · Architecture</text>
      </g>
    </g>
  </g>
</svg>
